spring:
    datasource:
        url: jdbc:postresql://localhost:5432/librarysdb
        username: daniel
        password: 123456
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: create-drop
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                "[physucal_naming_strategy]": org.hibernate.boot.model.naming.PhysucalNamingStrategyStandartImpl
                "[default_shema]": librarydb_schema
                "[format_sql]": true
                "[hbm2ddl.create_namespace]": true

    
    flyway:
        enabled: false

    queue:
        block-users: 
            fixed-delay-ms: 5000 
    
    server:
        port: 8081
    
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
