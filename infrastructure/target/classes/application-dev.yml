spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/librarydb}
    username: ${DB_USERNAME:daniel}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        default_schema: ${D B_SCHEMA:librarydb_schema}
        format_sql: true
    
  flyway:
    enabled: true
    locations: classpath:db/migration
    create-schemas: true
    schemas: ${DB_SCHEMA:librarydb_schema}
    default-schema: ${DB_SCHEMA:librarydb_schema}
    table: flyway_schema_history_librarydb
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    placeholders:
      db_schema: ${DB_SCHEMA:librarydb_schema}

queue:
  block-users:
    fixed-delay-ms: 5000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
